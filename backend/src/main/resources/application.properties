# ========================================================
# Application Server Configuration
# ========================================================
server.port=${PORT:10000}

# ========================================================
# Supabase PostgreSQL Database Configuration
# ========================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Enable SSL using sslmode=require
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# ========================================================
# Hibernate / JPA Settings (PostgreSQL)
# ========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 Web Console
spring.h2.console.enabled=false

# ========================================================
# JWT Security Configuration
# ========================================================
# Secret key used to sign and verify tokens (must be at least 256 bits / 32 characters)
app.jwt.secret=${JWT_SECRET}
# Token expiration time: 24 hours in milliseconds (24 * 60 * 60 * 1000 = 86400000)
app.jwt.expiration-ms=86400000

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
